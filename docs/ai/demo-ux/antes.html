<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard de Pedidos</title>
<!-- ANTES: generado sin la skill frontend-design, con el prompt
     "Crea la pantalla de pedidos del día para el dispatcher del Food Truck Planner". -->
<style>
@font-face { font-family: "Inter"; src: url(fonts/inter-latin-400-normal.woff2); font-weight: 400; }
@font-face { font-family: "Inter"; src: url(fonts/inter-latin-600-normal.woff2); font-weight: 600; }
@font-face { font-family: "Inter"; src: url(fonts/inter-latin-700-normal.woff2); font-weight: 700; }
* { box-sizing: border-box; }
body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #f5f7fb; color: #1f2937; }
header { background: linear-gradient(90deg, #6366f1, #3b82f6); color: white; padding: 24px 40px; }
header h1 { margin: 0; font-size: 28px; }
header p { margin: 4px 0 0; opacity: .85; }
main { padding: 32px 40px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 28px; }
.card { background: white; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.1); padding: 20px; }
.stat-label { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #6b7280; }
.stat-value { font-size: 36px; font-weight: 700; margin-top: 6px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 14px 12px; border-bottom: 1px solid #e5e7eb; font-size: 15px; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #6b7280; }
.badge { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.Received { background: #dbeafe; color: #1d4ed8; }
.Preparing { background: #fef3c7; color: #b45309; }
.Ready { background: #dcfce7; color: #15803d; }
.Picked { background: #f3f4f6; color: #4b5563; }
button { background: #3b82f6; color: white; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
.toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.toolbar h2 { margin: 0; font-size: 18px; }
</style>
</head>
<body>
<header>
  <h1>🚚 Food Truck Dashboard</h1>
  <p>Gestiona tus pedidos de forma rápida y sencilla</p>
</header>
<main>
  <div class="stats">
    <div class="card"><div class="stat-label">Total pedidos</div><div class="stat-value" id="s-total">0</div></div>
    <div class="card"><div class="stat-label">Recibidos</div><div class="stat-value" id="s-rec">0</div></div>
    <div class="card"><div class="stat-label">En preparación</div><div class="stat-value" id="s-prep">0</div></div>
    <div class="card"><div class="stat-label">Listos</div><div class="stat-value" id="s-ready">0</div></div>
  </div>
  <div class="card">
    <div class="toolbar"><h2>Pedidos</h2><button>+ Nuevo pedido</button></div>
    <table>
      <thead><tr><th>ID</th><th>Cliente</th><th>Camión</th><th>Items</th><th>Fecha</th><th>Estado</th><th>Acciones</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script>
// Misma forma que GET /pedidos (src/data/mock_data.py) con pedidos de ejemplo adicionales.
const pedidos = [
  { id: 1, fecha: "2026-08-28", camion_id: 1, cliente: "Ana Perez", items: ["Taco de pastor", "Agua"], estado: "Received" },
  { id: 2, fecha: "2026-08-28", camion_id: 2, cliente: "Luis Gomez", items: ["Quesadilla", "Limonada"], estado: "Preparing" },
  { id: 3, fecha: "2026-08-28", camion_id: 1, cliente: "Marta Rios", items: ["Burrito de res"], estado: "Preparing" },
  { id: 4, fecha: "2026-08-28", camion_id: 1, cliente: "Jorge Cano", items: ["Nachos", "Agua"], estado: "Ready" },
  { id: 5, fecha: "2026-08-28", camion_id: 2, cliente: "Sofia Mejia", items: ["Taco de pastor", "Taco de pastor", "Taco de pastor"], estado: "Received" },
  { id: 6, fecha: "2026-08-28", camion_id: 2, cliente: "Andres Velez", items: ["Quesadilla"], estado: "Picked Up" },
  { id: 7, fecha: "2026-08-28", camion_id: 1, cliente: "Laura Ochoa", items: ["Burrito de res", "Limonada"], estado: "Ready" }
];
document.getElementById("rows").innerHTML = pedidos.map(p => `
  <tr><td>#${p.id}</td><td>${p.cliente}</td><td>Camión ${p.camion_id}</td><td>${p.items.join(", ")}</td>
  <td>${p.fecha}</td><td><span class="badge ${p.estado.split(" ")[0]}">${p.estado}</span></td><td><button>Editar</button></td></tr>`).join("");
const c = e => pedidos.filter(p => p.estado === e).length;
document.getElementById("s-total").textContent = pedidos.length;
document.getElementById("s-rec").textContent = c("Received");
document.getElementById("s-prep").textContent = c("Preparing");
document.getElementById("s-ready").textContent = c("Ready");
</script>
</body>
</html>
